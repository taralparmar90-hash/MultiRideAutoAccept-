name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Clean XML Files
        run: |
          python3 -c '
          u = "http://" + "schemas." + "android." + "com/apk/res/android"
          m = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{u}">
              <application android:allowBackup="true" android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".MultiRideAcceptService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>"""
          c = f"""<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="{u}"
              android:description="@string/desc"
              android:packageNames="com.olacabs.driver, com.rapido.rider, in.mobility.bharattaxidriver"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="50"
              android:canRetrieveWindowContent="true" />"""
          open("app/src/main/AndroidManifest.xml", "w").write(m)
          open("app/src/main/res/xml/accessibility_service_config.xml", "w").write(c)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiRide-AutoAccept-APK
          path: app/build/outputs/apk/debug/app-debug.apk
